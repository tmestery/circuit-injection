[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-injection"
version = "0.1.0"
description = "Algorithmic circuit injection into small LMs — additive weight-space programming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "circuit-injection" }]
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "numpy>=1.24",
  "safetensors>=0.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
agent = ["openai>=1.40"]

[project.scripts]
circuit-inject = "circuit_injection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
